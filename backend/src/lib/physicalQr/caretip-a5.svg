<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
  viewBox="0 0 1410 2000"
  width="1410"
  height="2000"
  data-physical-template="caretip-a5-flyer"
  data-font-status="TEMPORARY_DEVELOPMENT_FONT_NOT_APPROVED_FOR_PRODUCTION"
  role="img">
  <!--
    Production artwork is the uploaded A5 flyer PNG (1410x2000).
    Dynamic nodes only: QR, business name, optional address.
    Do not bake a sample venue address into this file.
    Font for overlaid name/address is TEMPORARY until the official face is supplied.
  -->
  <title>CareTip A5 physical QR</title>
  <image id="physical-artwork"
         x="0" y="0" width="1410" height="2000"
         href="__CT_ARTWORK_HREF__" xlink:href="__CT_ARTWORK_HREF__"
         preserveAspectRatio="xMidYMid meet"/>
  <g id="physical-qr-well">
    <image id="physical-qr" x="401" y="792" width="609" height="613"
           href="__CT_QR_HREF__" xlink:href="__CT_QR_HREF__"
           preserveAspectRatio="xMidYMid meet"
           visibility="__CT_QR_VISIBILITY__"/>
  </g>
  <g id="physical-business-name" font-family="__CT_FONT_FAMILY__" fill="__CT_SECONDARY__" text-anchor="middle">
    <text x="705" y="1510" font-size="__CT_BUSINESS_NAME_SIZE__" font-weight="700">__CT_BUSINESS_NAME__</text>
  </g>
  <g id="physical-address" font-family="__CT_FONT_FAMILY__" fill="__CT_SECONDARY__" text-anchor="middle"
     display="__CT_ADDRESS_DISPLAY__" data-supports-address="__CT_SUPPORTS_ADDRESS__">
    <text id="physical-address-line-1" x="705" y="1556" font-size="24" font-weight="500">__CT_ADDRESS_LINE_1__</text>
    <text id="physical-address-line-2" x="705" y="1588" font-size="24" font-weight="500">__CT_ADDRESS_LINE_2__</text>
  </g>
</svg>
