<!DOCTYPE html>
<html
  lang="en"
  class="caretip-font-inter"
  style="font-family: Inter, 'Inter Fallback', ui-sans-serif, system-ui, sans-serif"
>
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#FAF9F6" />
    <meta name="theme-color" content="#FAF9F6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <meta name="msapplication-TileColor" content="#FAF9F6" />
    <meta
      name="description"
      content="CareTip: digital tipping for hospitality. Scan, tip, and support your team."
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="CareTip" />
    <title>CareTip</title>
    <style>
      /* Minimal first-paint mirror of AppBrandedLoadingScreen (web app cold start). */
      #root {
        min-height: 100vh;
        min-height: 100dvh;
      }

      html.dark body,
      html.dark #root {
        background-color: #0a0a0a;
      }

      html:not(.dark) body,
      html:not(.dark) #root {
        background-color: #fcfbf8;
      }

      #caretip-html-boot {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 9997;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0;
        margin: 0;
        padding: 0 1.5rem;
        background-color: #fcfbf8;
        color: #0a0a0a;
        font-family: Inter, "Inter Fallback", ui-sans-serif, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      html.dark #caretip-html-boot {
        background-color: #0a0a0a;
        color: #fafafa;
      }

      html.caretip-html-boot-active,
      html.caretip-html-boot-active body {
        background-color: #fcfbf8;
      }

      html.dark.caretip-html-boot-active,
      html.dark.caretip-html-boot-active body {
        background-color: #0a0a0a;
      }

      html.caretip-html-boot-active #caretip-html-boot {
        display: flex;
      }

      #caretip-html-boot.caretip-html-boot--exiting {
        animation: caretip-html-boot-fade-out 0.18s ease-in forwards;
        pointer-events: none;
      }

      @keyframes caretip-html-boot-fade-out {
        from {
          opacity: 1;
        }
        to {
          opacity: 0;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #caretip-html-boot.caretip-html-boot--exiting {
          animation: none;
          opacity: 0;
        }
      }

      .caretip-html-boot__mark {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.15rem;
        padding: 0.25rem;
        text-align: center;
      }

      .caretip-html-boot__icon-wrap {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .caretip-html-boot__icon-wrap::before {
        content: "";
        position: absolute;
        inset: -0.85rem;
        border-radius: 9999px;
        background: radial-gradient(
          ellipse at center,
          rgba(235, 153, 44, 0.14) 0%,
          rgba(235, 153, 44, 0.04) 50%,
          transparent 72%
        );
        pointer-events: none;
      }

      .caretip-html-boot__mark img {
        position: relative;
        z-index: 1;
        width: 4rem;
        height: 4rem;
        object-fit: contain;
        display: block;
      }

      @media (min-width: 640px) {
        .caretip-html-boot__mark img {
          width: 5rem;
          height: 5rem;
        }
      }

      .caretip-html-boot__track {
        position: relative;
        width: 8.75rem;
        height: 3px;
        overflow: hidden;
        border-radius: 9999px;
        background: rgba(15, 23, 42, 0.1);
        pointer-events: none;
      }

      html.dark .caretip-html-boot__track {
        background: rgba(250, 250, 250, 0.16);
      }

      .caretip-html-boot__indeterminate {
        position: absolute;
        inset: 0 auto 0 0;
        width: 38%;
        border-radius: inherit;
        background: rgb(235, 153, 44);
        animation: caretip-html-boot-indeterminate 1.15s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        will-change: transform;
      }

      .caretip-html-boot__tagline {
        margin: 0.15rem 0 0;
        max-width: 16rem;
        font-size: 0.875rem;
        font-weight: 400;
        line-height: 1.35;
        color: #64748b;
      }

      html.dark .caretip-html-boot__tagline {
        color: #a1a1aa;
      }

      @keyframes caretip-html-boot-indeterminate {
        0% {
          transform: translateX(-130%);
        }
        100% {
          transform: translateX(280%);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .caretip-html-boot__indeterminate {
          animation: none;
          inset: 0;
          width: 42%;
          left: 0;
          opacity: 0.9;
          background: rgb(235, 153, 44);
        }

        .caretip-html-boot__icon-wrap::before {
          opacity: 0.65;
        }
      }
    </style>
    <link rel="preload" href="/fonts/inter/inter-latin-400-normal.woff" as="font" type="font/woff" crossorigin />
    <link rel="preload" href="/fonts/manrope/manrope-latin-800.woff2" as="font" type="font/woff2" crossorigin />
    <!-- LCP hero — responsive preload; Vite rewrites to hashed asset URLs matching the hero <picture>. -->
    <link
      rel="preload"
      href="./images/wyc.avif"
      as="image"
      type="image/avif"
      media="(min-width: 768px)"
      fetchpriority="high"
    />
    <link
      rel="preload"
      href="./images/formemobile01.avif"
      as="image"
      type="image/avif"
      media="(max-width: 767px)"
      fetchpriority="high"
    />
    <link rel="stylesheet" href="/caretip-font-faces.css" />
    <link rel="icon" type="image/svg+xml" href="/brand/caretip-app-icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta property="og:image" content="/brand/caretip-logo-tagline.png" />
    <meta name="twitter:image" content="/brand/caretip-logo-tagline.png" />
    <script src="/theme-init.js"></script>
    <script src="/boot-locale.js"></script>
  </head>

  <body style="margin: 0">
    <div id="caretip-html-boot" role="status" aria-busy="true" hidden>
      <div class="caretip-html-boot__mark">
        <div class="caretip-html-boot__icon-wrap" aria-hidden="true">
          <img
            src="/brand/caretip-app-icon.svg"
            width="80"
            height="80"
            alt=""
            decoding="async"
            fetchpriority="high"
          />
        </div>
        <span class="caretip-html-boot__track" aria-hidden="true">
          <span class="caretip-html-boot__indeterminate"></span>
        </span>
        <p class="caretip-html-boot__tagline" id="caretip-html-boot-tagline">
          Getting things ready…
        </p>
      </div>
    </div>
    <script>
      (function () {
        var lng = "de";
        var tagline = "Wird eingerichtet…";
        try {
          var bootLocale = window.CareTipBootLocale;
          if (bootLocale) {
            lng = bootLocale.readBootLanguage();
            var copy = bootLocale.getCopy(lng);
            if (copy) {
              tagline = bootLocale.resolveBootTagline
                ? bootLocale.resolveBootTagline(copy, location.pathname)
                : copy.gettingReady || tagline;
            }
          }
          document.documentElement.setAttribute("lang", lng);
        } catch (_) {
          /* ignore */
        }
        var taglineEl = document.getElementById("caretip-html-boot-tagline");
        if (taglineEl) taglineEl.textContent = tagline;
        var el = document.getElementById("caretip-html-boot");
        if (!el) return;
        el.setAttribute("aria-label", "CareTip — " + tagline);
        el.removeAttribute("hidden");
        document.documentElement.classList.add("caretip-html-boot-active");
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
