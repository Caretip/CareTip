<!DOCTYPE html>
<html
  lang="en"
  class="caretip-font-inter"
  style="font-family: Inter, 'Inter Fallback', ui-sans-serif, system-ui, sans-serif"
>
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="theme-color" content="#FAF9F6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <meta name="msapplication-TileColor" content="#FAF9F6" />
    <meta
      name="description"
      content="CareTip: digital tipping for hospitality. Scan, tip, and support your team."
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="CareTip" />
    <title>CareTip</title>
    <style>
      /* Minimal first-paint mirror of AppBrandedLoadingScreen (marketing cold load only). */
      #root {
        min-height: 100vh;
        min-height: 100dvh;
      }

      html.dark body,
      html.dark #root {
        background-color: #0a0a0a;
      }

      #caretip-html-boot {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 9997;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0;
        margin: 0;
        padding: 0 1.5rem;
        background-color: #fcfbf8;
        color: #0a0a0a;
        font-family: Inter, "Inter Fallback", ui-sans-serif, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      html.dark #caretip-html-boot {
        background-color: #0a0a0a;
        color: #fafafa;
      }

      html.caretip-html-boot-active,
      html.caretip-html-boot-active body {
        background-color: #fcfbf8;
      }

      html.dark.caretip-html-boot-active,
      html.dark.caretip-html-boot-active body {
        background-color: #0a0a0a;
      }

      html.caretip-html-boot-active #caretip-html-boot {
        display: flex;
      }

      #caretip-html-boot.caretip-html-boot--exiting {
        animation: caretip-html-boot-fade-out 0.18s ease-in forwards;
        pointer-events: none;
      }

      @keyframes caretip-html-boot-fade-out {
        from {
          opacity: 1;
        }
        to {
          opacity: 0;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #caretip-html-boot.caretip-html-boot--exiting {
          animation: none;
          opacity: 0;
        }
      }

      .caretip-html-boot__mark {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0.35rem;
      }

      .caretip-html-boot__mark::before {
        content: "";
        position: absolute;
        inset: -0.65rem;
        border-radius: 9999px;
        background: radial-gradient(
          ellipse at center,
          rgba(235, 153, 44, 0.22) 0%,
          rgba(235, 153, 44, 0.06) 45%,
          transparent 72%
        );
        pointer-events: none;
      }

      .caretip-html-boot__mark img {
        position: relative;
        z-index: 1;
        width: 4rem;
        height: 4rem;
        object-fit: contain;
        display: block;
      }

      @media (min-width: 640px) {
        .caretip-html-boot__mark img {
          width: 4.5rem;
          height: 4.5rem;
        }
      }

      .caretip-html-boot__spinner {
        position: absolute;
        inset: -0.8rem;
        z-index: 2;
        border-radius: 9999px;
        border: 1.5px solid rgba(235, 153, 44, 0.14);
        border-top-color: rgb(235, 153, 44);
        border-right-color: rgba(235, 153, 44, 0.45);
        animation: caretip-html-boot-spin 0.85s linear infinite;
        pointer-events: none;
        box-sizing: border-box;
      }

      @keyframes caretip-html-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .caretip-html-boot__spinner {
          animation: none;
          border-color: rgba(235, 153, 44, 0.35);
          border-top-color: rgb(235, 153, 44);
          opacity: 0.85;
        }
      }
    </style>
    <link rel="preload" href="/fonts/manrope/manrope-latin-800.woff2" as="font" type="font/woff2" crossorigin />
    <!-- LCP hero — responsive preload; Vite rewrites to hashed asset URLs matching the hero <picture>. -->
    <link
      rel="preload"
      href="./images/wyc.avif"
      as="image"
      type="image/avif"
      media="(min-width: 768px)"
      fetchpriority="high"
    />
    <link
      rel="preload"
      href="./images/formemobile01.avif"
      as="image"
      type="image/avif"
      media="(max-width: 767px)"
      fetchpriority="high"
    />
    <link rel="stylesheet" href="/caretip-font-faces.css" />
    <link rel="icon" type="image/svg+xml" href="/brand/caretip-app-icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta property="og:image" content="/brand/caretip-logo-tagline.png" />
    <meta name="twitter:image" content="/brand/caretip-logo-tagline.png" />
    <script src="/theme-init.js"></script>
    <script src="/boot-locale.js"></script>
  </head>

  <body style="margin: 0; background-color: #fcfbf8">
    <div id="caretip-html-boot" role="status" aria-label="CareTip" aria-busy="true" hidden>
      <div class="caretip-html-boot__mark" aria-hidden="true">
        <img src="/brand/caretip-app-icon.svg" width="72" height="72" alt="" />
        <span class="caretip-html-boot__spinner"></span>
      </div>
    </div>
    <script>
      (function () {
        try {
          var bootLocale = window.CareTipBootLocale;
          var lng = bootLocale ? bootLocale.readBootLanguage() : "de";
          document.documentElement.setAttribute("lang", lng);
        } catch (_) {
          /* ignore */
        }
        var el = document.getElementById("caretip-html-boot");
        if (!el) return;
        el.removeAttribute("hidden");
        document.documentElement.classList.add("caretip-html-boot-active");
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
